{{- include "oncallkit.validate" . -}}
{{- if not .Values.existingSecret }}
{{- /* Keep generated values across upgrades: a new encryption key would make every stored
       webhook unreadable. */ -}}
{{- $previous := dict -}}
{{- with (lookup "v1" "Secret" .Release.Namespace (include "oncallkit.fullname" .)) }}
{{- $previous = .data | default dict -}}
{{- end }}
{{- $encryptionKey := .Values.encryptionKey | default (get $previous "ENCRYPTION_KEY" | default "" | b64dec) | default (randBytes 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oncallkit.fullname" . }}
  labels:
    {{- include "oncallkit.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  ENCRYPTION_KEY: {{ $encryptionKey | b64enc | quote }}
  {{- with .Values.google.clientId }}
  GOOGLE_CLIENT_ID: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.google.clientSecret }}
  GOOGLE_CLIENT_SECRET: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.metricsToken }}
  METRICS_TOKEN: {{ . | b64enc | quote }}
  {{- end }}
  {{- if and .Values.database.url (not .Values.postgresql.enabled) }}
  DATABASE_URL: {{ .Values.database.url | b64enc | quote }}
  {{- end }}
{{- end }}
