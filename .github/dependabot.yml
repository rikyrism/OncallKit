version: 2
# Minor and patch updates arrive grouped, one pull request per ecosystem. Major versions usually
# need code changes, so they are not proposed automatically; upgrade them deliberately.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      rust-minor: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups:
      web-minor: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: monthly }
    groups:
      base-images: { patterns: ["*"] }
    ignore:
      # Node moves between LTS lines by hand; odd majors are short-lived releases.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
