name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problems: please report privately, see SECURITY.md."
  - type: textarea
    id: what
    attributes: { label: What happened, description: "And what you expected instead." }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: OncallKit version or commit }
  - type: textarea
    id: logs
    attributes: { label: Relevant logs, description: "Remove webhook URLs, tokens and email addresses.", render: text }
